# Exemple de configuration robot — SO-101 leader / follower
#
# Ceci est un GABARIT. Les valeurs ci-dessous sont des espaces reserves,
# pas une configuration fonctionnelle. Copier en robot.yaml et renseigner
# apres identification reelle des ports (scripts/find_ports.sh).
#
# robot.yaml n'est pas commite : il est specifique a une machine.
#
# Toute valeur CHANGEME* doit etre remplacee avant usage : un fichier qui en
# contient encore n'est PAS une configuration valide. Les champs servo_variant,
# bus_supply_voltage, ratio et ref sont documentaires.

follower:
  type: so101_follower         # type CLI LeRobot 0.6.1 (--robot.type) ; calibration sous robots/so_follower/
  id: CHANGEME                 # identifiant utilise pour nommer la calibration
  port: CHANGEME               # ex. /dev/cu.usbmodemXXXX (macOS) — a relever, jamais a deviner
  servo_variant: "STS3215 7.4V (gamme Standard)"  # NE PAS melanger avec la gamme 12V (Pro)
  bus_supply_voltage: 5        # V — architecture Standard, voir power ci-dessous
  # Affectation follower : 6 x 1/345 — PROVEN amont (docs/source/so101.mdx @ LeRobot v0.6.1 (commit 7e241bd6), l.35-44).
  # Valeurs ATTENDUES (amont), pas mesurees sur le bras.
  physical_check: CHANGEME_AFTER_HARDWARE_VERIFICATION   # marquage servos releve -> evidence/
  motors:                      # 6 moteurs, ids 1 a 6
    shoulder_pan:   { id: 1, ratio: "1:345", ref: STS3215-C001 }
    shoulder_lift:  { id: 2, ratio: "1:345", ref: STS3215-C001 }
    elbow_flex:     { id: 3, ratio: "1:345", ref: STS3215-C001 }
    wrist_flex:     { id: 4, ratio: "1:345", ref: STS3215-C001 }
    wrist_roll:     { id: 5, ratio: "1:345", ref: STS3215-C001 }
    gripper:        { id: 6, ratio: "1:345", ref: STS3215-C001 }

leader:
  type: so101_leader           # type CLI LeRobot 0.6.1 (--teleop.type) ; calibration sous teleoperators/so_leader/
  id: CHANGEME
  port: CHANGEME
  servo_variant: "STS3215 7.4V (gamme Standard)"
  bus_supply_voltage: 5        # V — architecture Standard
  # Affectation reduction <-> articulation du leader : PROVEN amont
  # (docs/source/so101.mdx @ LeRobot v0.6.1 (commit 7e241bd6), l.35-44). Reference Cxxx deduite de la reduction via la nomenclature
  # (C001 = 1:345, C044 = 1:191, C046 = 1:147 ; total paire 7 / 2 / 3, coherent).
  # Conformite physique du leader assemble (marquage du servo releve a chaque
  # articulation) : NON relevee — a consigner dans evidence/ avant teleoperation.
  # Valeurs ATTENDUES (amont), pas mesurees sur le bras.
  physical_check: CHANGEME_AFTER_HARDWARE_VERIFICATION   # marquage servos releve -> evidence/
  motors:
    shoulder_pan:   { id: 1, ratio: "1:191", ref: STS3215-C044 }
    shoulder_lift:  { id: 2, ratio: "1:345", ref: STS3215-C001 }
    elbow_flex:     { id: 3, ratio: "1:191", ref: STS3215-C044 }
    wrist_flex:     { id: 4, ratio: "1:147", ref: STS3215-C046 }
    wrist_roll:     { id: 5, ratio: "1:147", ref: STS3215-C046 }
    gripper:        { id: 6, ratio: "1:147", ref: STS3215-C046 }

power:
  supply: "5V 4A, barrel 5.5 x 2.1 mm, centre positif"
  # Plage nominale couramment documentee pour la carte Waveshare : 9-12.6V.
  # La doc Waveshare admet aussi une tension bus servo injectee plus basse
  # (zone 5-8.4V) ; la sortie bus suit la tension fournie. Le SO-101 Standard
  # est alimente en 5V dans son ecosysteme amont. (Elements rapportes par la
  # revue HQ ENYO-14, citation primaire a archiver dans evidence/.)
  # Regle : la tension fournie doit correspondre a l'architecture servo visee —
  # jamais de 12V sur un bras Standard. Avant la premiere mise sous tension :
  # verifier la doc de la carte en main, polarite, connecteur, et mesurer la
  # tension sous charge.
  # Voir ../docs/hardware.md §2
